<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - HDS Automação</title>
  <link rel="stylesheet" href="/css/compra.css">
  <script src="https://sdk.mercadopago.com/js/v2"></script>
  <link rel="icon" type="image/x-icon" href="/images/profilefinalv.png?v=2">
</head>
<body>

    <div id="header-placeholder"></div>
  <script src="/js/header2.js?v=2"></script>


  <main class="compra-main">
    <div class="compra-header">
      <h1>Finalizar Compra</h1>
      <p id="compra-subtitulo">A verificar os itens do carrinho...</p>
    </div>

    <ul class="compra-itens" id="compra-lista-itens"></ul>

    <div class="compra-resumo-total" id="compra-bloco-total" style="display: none;">
      <span>Total do Pedido</span>
      <strong id="compra-total">R$ 0,00</strong>
    </div>

    <div id="area-admin-solicitar" class="compra-secao" style="display: none;">
      <h2>Modo Administrador</h2>
      <p style="margin:0 0 12px 0;font-size:14px;color:#cbd5e1;">
        Conta admin detectada: não é necessário realizar pagamento.
      </p>
      <button type="button" class="btn-admin-solicitar" id="btn-enviar-admin">
        Enviar solicitação para admin
      </button>
    </div>

    <div id="area-checkout" style="display: none;">
      <section class="compra-secao">
        <h2>Dados do Cliente e Entrega</h2>
        <div class="campo-grupo">
          <div class="campo">
            <label for="cliente-nome">Nome completo / Utilizador</label>
            <input type="text" id="cliente-nome" placeholder="O teu nome completo" required>
          </div>
          <div class="campo">
            <label for="cliente-email">E-mail</label>
            <input type="email" id="cliente-email" placeholder="teu@email.com" required>
          </div>
        </div>

        <div class="campo-grupo full">
          <div class="campo">
            <label for="cliente-cpf">CPF / CNPJ</label>
            <input type="text" id="cliente-cpf" placeholder="000.000.000-00" required>
          </div>
        </div>

        <div class="campo-grupo">
          <div class="campo">
            <label for="cliente-cep">CEP</label>
            <input type="text" id="cliente-cep" placeholder="00000-000" required>
          </div>
          <div class="campo">
            <label for="cliente-cidade">Cidade / UF</label>
            <input type="text" id="cliente-cidade" placeholder="Curitiba - PR" required>
          </div>
        </div>

        <div class="campo-grupo">
          <div class="campo">
            <label for="cliente-endereco">Endereço (Rua / Av.)</label>
            <input type="text" id="cliente-endereco" placeholder="Rua das Flores" required>
          </div>
          <div class="campo">
            <label for="cliente-numero">Número / Complemento</label>
            <input type="text" id="cliente-numero" placeholder="123, Galpão 2" required>
          </div>
        </div>
      </section>

      <section class="compra-secao">
        <h2>Método de Pagamento (Mercado Pago)</h2>
        <div id="paymentBrick_container"></div>

        <div id="pagamento-padrao-box">
          <div class="campo-grupo full">
            <div class="campo">
              <label for="metodo-pagamento-select">Escolhe o método de pagamento</label>
              <select id="metodo-pagamento-select">
                <option value="pix">Pix</option>
                <option value="credit_card">Cartão de Crédito</option>
                <option value="debit_card">Cartão de Débito</option>
                <option value="bolbradesco">Boleto Bancário</option>
              </select>
            </div>
          </div>
          <button type="button" class="btn-pagar-padrao" id="btn-confirmar-pagamento">
            Pagar agora
          </button>
          <p class="aviso-mp" id="aviso-mp-status"></p>
        </div>
      </section>
    </div>

    <div id="compra-confirmacao"></div>
  </main>

  <script src="/js/compra.js" defer></script>

    <!-- rodapé -->
  <div id="footer-placeholder"></div>
  <script src="/js/footer2.js"></script> 
</body>
</html>
