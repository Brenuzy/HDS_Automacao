<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conta - HDS Automação</title>
  <link rel="stylesheet" href="/css/login.css">
  <script src="/js/login.js"></script>
</head>
<body>  
    
  <div id="header-placeholder"></div>
  <script src="/js/header.js"></script> 

    <!-- Área Principal do Formulário -->
<main class="main-content">
  <div class="card">
    <h2 id="titulo">LOGIN</h2>
    
      <form onsubmit="enviarFormulario(event)">
      
      <!-- Campo exclusivo do Cadastro (inicia desativado/oculto) -->
      <div class="field campo-cadastro" style="display: none;">
        <input type="text" id="nome" placeholder="Nome Completo" disabled>
      </div>

      <div class="field">
        <input type="text" id="login" placeholder="Login" required>
      </div>
      
      <div class="field">
        <input type="password" id="senha" placeholder="Senha" required>
      </div>
      
<button type="submit" class="entrar" id="btnSubmit">Entrar</button>

      <div id="msg"></div>
      
      <div class="switch">
        <span id="txtSwitch">Não tem uma conta,</span>
        <button type="button" class="cadastrar" id="btnToggle" onclick="alternarModo()">Cadastre-se.</button>
      </div>
    </form> 
  </div>
</main>
  
  <!-- rodapé -->
  <div id="footer-placeholder"></div>
  <script src="/js/footer.js"></script> 
</body>
</html>
