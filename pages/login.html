<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HDS Automações - Login</title>
  <link rel="stylesheet" href="/css/login.css">
  <script src="/js/login.js"></script>
</head>
<body>  
    
  <div id="header-placeholder"></div>
  <script src="/js/header.js"></script> 

    <!-- Área Principal do Formulário -->
    <main class="main-content">
      <div class="card">
        <h2>Criar Conta</h2>
        <form id="cadForm">
          <div class="field">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required placeholder="Digite o seu nome">
          </div>
          <div class="field">
            <label for="email">E-mail:</label>
            <input type="email" id="email" required placeholder="exemplo@dominio.com">
          </div>
          <div class="field">
            <label for="senha">Palavra-passe:</label>
            <input type="password" id="senha" minlength="6" required placeholder="Mínimo 6 caracteres">
          </div>
          <div class="field">
            <label for="confirmarSenha">Confirmar Palavra-passe:</label>
            <input type="password" id="confirmarSenha" required placeholder="Repita a palavra-passe">
          </div>
          <button type="submit">Cadastrar</button>
        </form>
        <div id="msg"></div>
      </div>
    </main>
  </div>

  <!-- rodapé -->
  <div id="footer-placeholder"></div>
  <script src="/js/footer.js"></script> 
</body>
</html>
