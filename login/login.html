<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conta - HDS Automações</title>
  <link rel="stylesheet" href="login.css">
  <script src="login.js"></script>
</head>
<body>  

    <!-- ESTRUTURA HTML DO SEU FORMULÁRIO -->
  <div class="container">
    
    <!-- FORMULÁRIO DE LOGIN -->
    <form id="loginForm" onsubmit="fazerLogin(event)">
      <h2>Login</h2>
      
      <div class="field">
        <label for="loginEmail">E-mail</label>
        <input type="email" id="loginEmail" required>
      </div>
      
      <div class="field">
        <label for="loginSenha">Senha</label>
        <input type="password" id="loginSenha" required>
      </div>
      
      <button type="submit">ENTRAR</button>
      
      <p class="switch">
        Não tem conta? <a href="#" onclick="toggleForm()">Cadastre-se</a>
      </p>
    </form>

    <!-- FORMULÁRIO DE CADASTRO -->
    <form id="registerForm" class="hidden">
      <h2>Cadastro</h2>
      
      <div class="field">
        <label>Nome</label>
        <input type="text" required>
      </div>
      
      <div class="field">
        <label>E-mail</label>
        <input type="email" required>
      </div>
      
      <div class="field">
        <label>Senha</label>
        <input type="password" required>
      </div>
      
      <button type="submit">CADASTRAR</button>
      
      <p class="switch">
        Já tem conta? <a href="#" onclick="toggleForm()">Fazer Login</a>
      </p>
    </form>

  </div>

  <!-- SCRIPT PARA INTERAÇÃO DOS FORMULÁRIOS -->
  <script>
    function toggleForm() {
      document.getElementById('loginForm').classList.toggle('hidden');
      document.getElementById('registerForm').classList.toggle('hidden');
    }

    function fazerLogin(event) {
  event.preventDefault();

  const email = document.getElementById('loginEmail').value;
  const senha = document.getElementById('loginSenha').value;

  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, senha })
  })
  .then(response => response.json())
  .then(data => {
    if (data.sucesso) {
      window.location.href = "../paginainicial/paginainicial.html";
    } else {
      alert("E-mail ou senha incorretos!");
    }
  });
}
  </script>

</body>
</html>
